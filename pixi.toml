[workspace]
authors = ["Matthew Bradberry <matthew.bradberry@gmail.com>"]
channels = ["conda-forge", "robostack-humble"]
name = "perception"
platforms = ["osx-arm64"]
version = "0.1.0"

[activation.env]
TURTLEBOT3_MODEL = "burger"

[tasks]
sim      = "ros2 launch turtlebot3_gazebo turtlebot3_world.launch.py"
baseline = "python scripts/perception_baseline.py"
candidate = "python scripts/perception_candidate.py"
record-run = "python scripts/record_run.py"
compare = "python scripts/compare_runs.py runs/baseline.jsonl runs/candidate.jsonl"
control = "ros2 run turtlebot3_teleop teleop_keyboard"
record  = "ros2 bag record -s mcap -o run --all"
record-golden = "ros2 bag record -s mcap -o bags/golden_obstacle /scan /tf /tf_static /odom"
replay  = "ros2 bag play run"

[dependencies]
ros-humble-desktop                = ">=0.10.0,<0.11"
ros-humble-turtlebot3-gazebo      = ">=2.3.8,<3"
ros-humble-turtlebot3-teleop      = ">=2.3.6,<3"
ros-humble-rosbag2-storage-mcap   = ">=0.15.16,<0.16"
